name: Validate Boundaries

on:
  push:
    branches: [main]
    paths:
      - "processed-data/**"
      - "metadata/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "processed-data/**"
      - "metadata/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --upgrade pip && pip install "shapely>=2.1.0"
      - name: Syntax check and validate boundaries
        run: python -m py_compile scripts/ingest.py scripts/validate.py && python scripts/validate.py
